<!doctype html>
<html>
  <head>
    {% if title %}
      <title>{{ title }} - Микроблог</title>
    {% else %}
      <title>Добро пожаловать!</title>
    {% endif %}
  </head>
  <body>
    <div> Мой блог: <a href="{{ url_for('index') }}"> Домой </a>
                    <a href="{{ url_for('login') }}"> Логин </a>
    </div>
    <hr>
    {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul>
          {% for message in messages %}
            <li> {{ message }}</li>
          
          {% endfor %}

      </ul>
    {% endif %}
    {% endwith %}
    {% block content %}
    {% endblock %}
  </body>
</html>
